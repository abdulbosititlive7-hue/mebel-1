<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nordic & Botanic — Interyer Studiyasi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--panel:#fff;--card:#f7f5f1;--line:#e4e0d8;--tx:#1d2428;--mu:#6b747a;--ac:#0e8fa3;--ac2:#2563eb;--ok:#0f9d6b;--dg:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--panel:#131924;--card:#1a2232;--line:#263044;--tx:#f1f3f6;--mu:#97a1ad;--ac:#22d3ee;--ok:#34d399}}
:root[data-theme="dark"]{--bg:#0b0f17;--panel:#131924;--card:#1a2232;--line:#263044;--tx:#f1f3f6;--mu:#97a1ad;--ac:#22d3ee;--ok:#34d399}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.logo{font-weight:800;letter-spacing:.04em;font-size:15px}.logo small{display:block;font-weight:400;color:var(--mu);font-size:11px;letter-spacing:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}
.btn:hover{border-color:var(--ac)}
.pri{background:linear-gradient(90deg,var(--ac2),var(--ac));color:#fff;border:0}
.grn{background:var(--ok);color:#fff;border:0}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 18px;max-width:1500px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);margin-bottom:10px}
.rooms{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.room{flex:0 0 120px;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;text-align:center;font-size:11px;font-weight:600}
.room.on{border-color:var(--ac)}.room canvas{width:100%;display:block}.room span{display:block;padding:5px}
.upload{flex:0 0 120px;border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--mu);cursor:pointer;padding:8px;text-align:center}
.upload:hover{border-color:var(--ac);color:var(--ac)}
.stagewrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
#stage{display:block;width:100%;height:auto;touch-action:none;cursor:default}
.tools{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;gap:6px;background:var(--panel);border:1px solid var(--line);padding:6px;border-radius:14px;box-shadow:0 8px 24px #0004;flex-wrap:wrap;justify-content:center;max-width:94%}
.tools.show{display:flex}.tools button{padding:7px 10px;border-radius:10px;background:var(--card);font-size:12px;font-weight:600}
.tools button:hover{background:var(--ac);color:#fff}.tools .del:hover{background:var(--dg)}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;padding:6px 12px;border-radius:99px;font-size:11px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.bar b{color:var(--ok);font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{padding:7px 12px;border-radius:10px;background:var(--card);color:var(--mu);font-weight:700;font-size:12px;white-space:nowrap}
.tab.on{background:var(--ac2);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:70vh;overflow-y:auto}
@media(max-width:900px){.grid{max-height:none;grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;text-align:left}
.item:hover{border-color:var(--ac)}.item img{width:100%;height:80px;object-fit:contain;display:block}
.item h4{font-size:12px;margin-top:6px}.item p{color:var(--ok);font-weight:800;font-size:12px;margin-top:2px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border-radius:10px;margin-bottom:6px;font-size:12px}
.li img{width:34px;height:34px;object-fit:contain}.li div{flex:1}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
input:focus{outline:2px solid var(--ac)}
label{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;display:none;z-index:60;max-width:90%}
</style>
</head>
<body>
<header>
  <div class="logo">NORDIC &amp; BOTANIC<small>Interyer vizualizatori — mebelni xonaga joylashtiring</small></div>
  <div class="row">
    <button class="btn" onclick="clearAll()">Tozalash</button>
    <button class="btn pri" onclick="openOrder()">Buyurtma (<span id="hTotal">0 so'm</span>)</button>
    <button class="btn grn" onclick="exportPNG()">PNG yuklash</button>
  </div>
</header>
<main>
  <section>
    <div class="rooms" id="rooms"></div>
    <div class="stagewrap">
      <canvas id="stage" width="1200" height="720"></canvas>
      <div class="hint">Mebelni tanlang → suring · burchakdan kattalashtiring · yuqoridagi nuqtadan aylantiring</div>
      <div class="tools" id="tools">
        <button onclick="layer(1)">↑ Oldinga</button><button onclick="layer(-1)">↓ Orqaga</button>
        <button onclick="flip()">⇋ Burish</button><button onclick="dup()">⧉ Nusxa</button>
        <button class="del" onclick="delSel()">🗑 O'chirish</button>
      </div>
    </div>
    <div class="bar"><span>Mebellar: <b id="cnt" style="color:var(--ac)">0 dona</b></span><span>Jami: <b id="total">0 so'm</b></span></div>
  </section>
  <aside class="panel">
    <h2>Mebellar katalogi</h2>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </aside>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeOrder()">
  <div class="box">
    <div class="row" style="justify-content:space-between;margin-bottom:4px"><h3 style="font-size:18px">Buyurtmani rasmiylashtirish</h3><button class="btn" onclick="closeOrder()">✕</button></div>
    <p style="color:var(--mu);font-size:12px;margin-bottom:12px">Xona dizayningizdagi mebellar</p>
    <div id="olist"></div>
    <div class="row" style="justify-content:space-between;margin:12px 0;font-weight:800"><span>Jami:</span><span id="mTotal" style="color:var(--ok)"></span></div>
    <label>Ismingiz</label><input id="nm" placeholder="Sardor Rahimov">
    <label>Telefon</label><input id="ph" type="tel" placeholder="+998 90 123 45 67">
    <button class="btn pri" style="width:100%;padding:12px" onclick="submitOrder()">Xaridni tasdiqlash</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const sum=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+" so'm";
const S=(w,h,b)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">${b}</svg>`;
const sh=(w,h,y)=>`<ellipse cx="${w/2}" cy="${y}" rx="${w*.46}" ry="6" fill="#0003"/>`;
const ITEMS=[
{id:'sofa',n:'Kyoto Divan',c:'sofa',p:8500000,w:300,svg:S(200,100,sh(200,100,92)+'<rect x="22" y="14" width="156" height="46" rx="14" fill="#9aa59c"/><rect x="6" y="36" width="34" height="50" rx="12" fill="#8a968d"/><rect x="160" y="36" width="34" height="50" rx="12" fill="#8a968d"/><rect x="30" y="52" width="140" height="34" rx="10" fill="#b4beb5"/><rect x="40" y="86" width="6" height="8" fill="#5a4636"/><rect x="154" y="86" width="6" height="8" fill="#5a4636"/>')},
{id:'chair',n:'Lounge Kreslo',c:'sofa',p:3200000,w:170,svg:S(100,110,sh(100,110,102)+'<rect x="14" y="8" width="72" height="56" rx="18" fill="#d49a5a"/><rect x="4" y="44" width="20" height="40" rx="9" fill="#c0874a"/><rect x="76" y="44" width="20" height="40" rx="9" fill="#c0874a"/><rect x="18" y="58" width="64" height="26" rx="9" fill="#e0ad70"/><path d="M26 84L20 104M74 84L80 104" stroke="#5a4636" stroke-width="5" stroke-linecap="round"/>')},
{id:'coffee',n:'Nara Kofe Stoli',c:'table',p:1900000,w:190,svg:S(160,70,sh(160,70,64)+'<ellipse cx="80" cy="26" rx="70" ry="16" fill="#c9a77c"/><ellipse cx="80" cy="22" rx="70" ry="16" fill="#dcbc92"/><path d="M34 34L28 62M126 34L132 62M80 38V64" stroke="#5a4636" stroke-width="5" stroke-linecap="round"/>')},
{id:'dining',n:'Eman Ovqat Stoli',c:'table',p:4800000,w:290,svg:S(220,100,sh(220,100,94)+'<rect x="10" y="22" width="200" height="14" rx="5" fill="#a9794a"/><rect x="10" y="22" width="200" height="6" rx="3" fill="#c79563"/><rect x="26" y="36" width="9" height="56" fill="#7a5530"/><rect x="185" y="36" width="9" height="56" fill="#7a5530"/><rect x="60" y="36" width="7" height="44" fill="#8a6038"/><rect x="153" y="36" width="7" height="44" fill="#8a6038"/>')},
{id:'shelf',n:'Kitob Javoni',c:'table',p:3600000,w:150,svg:S(90,150,sh(90,150,146)+'<rect x="6" y="4" width="78" height="138" rx="4" fill="#b98a58"/><rect x="12" y="10" width="66" height="30" fill="#8a6038"/><rect x="12" y="44" width="66" height="30" fill="#8a6038"/><rect x="12" y="78" width="66" height="30" fill="#8a6038"/><rect x="12" y="112" width="66" height="26" fill="#8a6038"/><rect x="18" y="16" width="8" height="24" fill="#2563eb"/><rect x="28" y="20" width="8" height="20" fill="#e9c46a"/><rect x="50" y="52" width="14" height="22" fill="#2a9d8f"/><rect x="20" y="86" width="22" height="22" rx="4" fill="#e76f51"/>')},
{id:'lamp',n:'Zen Torsher',c:'lighting',p:1100000,w:90,svg:S(60,160,sh(60,160,154)+'<path d="M14 40L22 6H38L46 40Z" fill="#f6e3b4"/><rect x="29" y="40" width="2.5" height="108" fill="#3a3a3a"/><ellipse cx="30" cy="150" rx="16" ry="4" fill="#3a3a3a"/>')},
{id:'pendant',n:'Osma Chiroq',c:'lighting',p:780000,w:90,svg:S(60,100,'<rect x="29" y="0" width="2" height="44" fill="#333"/><path d="M6 76Q30 30 54 76Z" fill="#e9c46a"/><ellipse cx="30" cy="76" rx="24" ry="4" fill="#fff8d0"/>')},
{id:'plant',n:'Palma O\'simlik',c:'decor',p:650000,w:130,svg:S(100,150,sh(100,150,144)+'<path d="M50 90Q20 70 10 30Q40 40 50 90ZM50 90Q50 50 48 6Q66 40 50 90ZM50 90Q80 70 92 28Q60 40 50 90ZM50 90Q30 90 6 78Q28 64 50 90ZM50 90Q72 92 94 80Q72 64 50 90Z" fill="#3f8f5a"/><path d="M30 96H70L64 142H36Z" fill="#c8794a"/><rect x="28" y="92" width="44" height="8" rx="3" fill="#db8c5c"/>')},
{id:'rug',n:'Soft Gilam',c:'decor',p:2400000,w:340,svg:S(240,80,'<ellipse cx="120" cy="40" rx="116" ry="34" fill="#d8cfc0"/><ellipse cx="120" cy="40" rx="92" ry="26" fill="none" stroke="#b9ab94" stroke-width="3"/><ellipse cx="120" cy="40" rx="64" ry="17" fill="#e8e0d2"/>')},
{id:'art',n:'Devor Surati',c:'decor',p:520000,w:120,svg:S(90,110,'<rect x="3" y="3" width="84" height="104" fill="#3a3a3a"/><rect x="9" y="9" width="72" height="92" fill="#f1ebdd"/><circle cx="45" cy="42" r="20" fill="#e76f51"/><path d="M9 101V72Q30 52 50 74T81 66V101Z" fill="#2a9d8f"/>')}
];
ITEMS.forEach(it=>{const i=new Image();i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(it.svg);it.img=i;it.url=i.src});
const ROOMS={a:{n:'Skandinaviya',wall:['#f1ede6','#e2dccf'],floor:['#d3b189','#b8956a'],win:1},b:{n:'Yotoqxona',wall:['#dde3e4','#c6cfd1'],floor:['#c0a07f','#a2825f'],win:1},c:{n:'Studio',wall:['#f4f1ec','#e6e1d8'],floor:['#9aa0a4','#7c8286'],win:2},d:{n:'Qorong\'i zal',wall:['#3a4846','#27322f'],floor:['#7a604a','#5a4635'],win:0}};
const W=1200,H=720,HZ=.6*H;
function drawRoom(c,w,h,r){const hz=.6*h,k=w/W;
 let g=c.createLinearGradient(0,0,0,hz);g.addColorStop(0,r.wall[0]);g.addColorStop(1,r.wall[1]);c.fillStyle=g;c.fillRect(0,0,w,hz);
 g=c.createLinearGradient(0,hz,0,h);g.addColorStop(0,r.floor[0]);g.addColorStop(1,r.floor[1]);c.fillStyle=g;c.fillRect(0,hz,w,h-hz);
 c.strokeStyle='#0000000d';c.lineWidth=1;for(let i=1;i<14;i++){const y=hz+(h-hz)*Math.pow(i/14,1.7);c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
 c.fillStyle='#ffffffaa';c.fillRect(0,hz-10*k,w,10*k);
 const wins=r.win===2?[[.12,.2],[.58,.2]]:r.win?[[.36,.2]]:[];
 wins.forEach(([x,y])=>{const wx=x*w,wy=y*h,ww=(r.win===2?.3:.28)*w,wh=.33*h;
  g=c.createLinearGradient(0,wy,0,wy+wh);g.addColorStop(0,'#bfe3f5');g.addColorStop(1,'#eaf6fb');
  c.fillStyle='#fff';c.fillRect(wx-6*k,wy-6*k,ww+12*k,wh+12*k);c.fillStyle=g;c.fillRect(wx,wy,ww,wh);
  c.fillStyle='#fff';c.fillRect(wx+ww/2-3*k,wy,6*k,wh);c.fillRect(wx,wy+wh/2-3*k,ww,6*k);
  c.fillStyle='#fff3';c.beginPath();c.moveTo(wx,wy+wh+6*k);c.lineTo(wx+ww,wy+wh+6*k);c.lineTo(wx+ww+120*k,h);c.lineTo(wx-80*k,h);c.fill()});
 g=c.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,h);g.addColorStop(0,'#0000');g.addColorStop(1,'#00000030');c.fillStyle=g;c.fillRect(0,0,w,h)}
const cv=$('stage'),cx=cv.getContext('2d');
let room='a',bg=null,objs=[],sel=-1,mode=null,off={x:0,y:0},cat='all',uid=0;
function buildRooms(){const box=$('rooms');box.innerHTML='';
 Object.entries(ROOMS).forEach(([k,r])=>{const d=document.createElement('div');d.className='room'+(room===k&&!bg?' on':'');const c=document.createElement('canvas');c.width=240;c.height=144;drawRoom(c.getContext('2d'),240,144,r);d.appendChild(c);d.insertAdjacentHTML('beforeend','<span>'+r.n+'</span>');d.onclick=()=>{room=k;bg=null;buildRooms();draw()};box.appendChild(d)});
 const u=document.createElement('label');u.className='upload';u.innerHTML='<span style="font-size:22px">📷</span>O\'z xonangiz rasmi<input type="file" accept="image/*" hidden>';u.querySelector('input').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const i=new Image();i.onload=()=>{bg=i;buildRooms();draw()};i.src=rd.result};rd.readAsDataURL(f)};box.appendChild(u)}
function renderCat(){const cats=[['all','Barchasi'],['sofa','Divan & Kreslo'],['table','Stol & Javon'],['lighting','Yoritgich'],['decor','Dekor']];
 $('tabs').innerHTML=cats.map(([k,n])=>`<button class="tab ${cat===k?'on':''}" onclick="cat='${k}';renderCat()">${n}</button>`).join('');
 $('grid').innerHTML=ITEMS.filter(i=>cat==='all'||i.c===cat).map(i=>`<button class="item" onclick="add('${i.id}')"><img src="${i.url}" alt=""><h4>${i.n}</h4><p>${sum(i.p)}</p></button>`).join('')}
function add(id){const it=ITEMS.find(i=>i.id===id),a=it.img.naturalWidth/it.img.naturalHeight||1.5,w=it.w,h=w/a,n=objs.length%6*18;
 objs.push({uid:++uid,it,x:W/2-w/2+n,y:H*(it.id==='art'?.25:.55)-h/2+n,w,h,rot:0,fl:false});sel=objs.length-1;upd();draw()}
function draw(){cx.clearRect(0,0,W,H);
 if(bg){const s=Math.max(W/bg.width,H/bg.height),w=bg.width*s,h=bg.height*s;cx.drawImage(bg,(W-w)/2,(H-h)/2,w,h)}else drawRoom(cx,W,H,ROOMS[room]);
 objs.forEach((o,i)=>{cx.save();cx.translate(o.x+o.w/2,o.y+o.h/2);cx.rotate(o.rot);if(o.fl)cx.scale(-1,1);cx.drawImage(o.it.img,-o.w/2,-o.h/2,o.w,o.h);cx.restore();if(i===sel&&!exporting)box(o)})}
let exporting=false;
function box(o){cx.save();cx.translate(o.x+o.w/2,o.y+o.h/2);cx.rotate(o.rot);cx.strokeStyle='#06b6d4';cx.lineWidth=2;cx.setLineDash([7,5]);cx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);cx.setLineDash([]);
 cx.beginPath();cx.moveTo(0,-o.h/2);cx.lineTo(0,-o.h/2-26);cx.stroke();
 cx.fillStyle='#22d3ee';cx.fillRect(o.w/2-8,o.h/2-8,16,16);
 cx.beginPath();cx.arc(0,-o.h/2-26,9,0,7);cx.fillStyle='#06b6d4';cx.fill();cx.strokeStyle='#fff';cx.stroke();cx.restore()}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function loc(o,p){const dx=p.x-(o.x+o.w/2),dy=p.y-(o.y+o.h/2),c=Math.cos(-o.rot),s=Math.sin(-o.rot);return{x:dx*c-dy*s,y:dx*s+dy*c}}
cv.addEventListener('pointerdown',e=>{const p=pos(e);cv.setPointerCapture(e.pointerId);
 if(sel>=0){const o=objs[sel],l=loc(o,p);
  if(Math.hypot(l.x,l.y+o.h/2+26)<20){mode='rot';return}
  if(Math.abs(l.x-o.w/2)<20&&Math.abs(l.y-o.h/2)<20){mode='scl';return}}
 let f=-1;for(let i=objs.length-1;i>=0;i--){const l=loc(objs[i],p);if(Math.abs(l.x)<=objs[i].w/2&&Math.abs(l.y)<=objs[i].h/2){f=i;break}}
 sel=f;if(f>=0){mode='mv';off={x:p.x-objs[f].x,y:p.y-objs[f].y}}
 $('tools').classList.toggle('show',f>=0);draw()});
cv.addEventListener('pointermove',e=>{if(!mode||sel<0)return;const p=pos(e),o=objs[sel];
 if(mode==='mv'){o.x=p.x-off.x;o.y=p.y-off.y}
 else if(mode==='rot'){o.rot=Math.atan2(p.y-(o.y+o.h/2),p.x-(o.x+o.w/2))+Math.PI/2}
 else{const l=loc(o,p),a=o.w/o.h,nw=Math.max(40,Math.min(900,l.x*2)),cxm=o.x+o.w/2,cym=o.y+o.h/2;o.w=nw;o.h=nw/a;o.x=cxm-o.w/2;o.y=cym-o.h/2}
 draw()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>mode=null));
addEventListener('keydown',e=>{if(sel>=0&&(e.key==='Delete'||e.key==='Backspace')&&!/INPUT/.test(document.activeElement.tagName))delSel()});
function layer(d){const j=sel+d;if(sel<0||j<0||j>=objs.length)return;[objs[sel],objs[j]]=[objs[j],objs[sel]];sel=j;draw()}
function flip(){if(sel>=0){objs[sel].fl=!objs[sel].fl;draw()}}
function dup(){if(sel<0)return;const o=objs[sel];objs.push({...o,uid:++uid,x:o.x+30,y:o.y+30});sel=objs.length-1;upd();draw()}
function delSel(){if(sel<0)return;objs.splice(sel,1);sel=-1;$('tools').classList.remove('show');upd();draw()}
function clearAll(){objs=[];sel=-1;$('tools').classList.remove('show');upd();draw()}
function total(){return objs.reduce((a,o)=>a+o.it.p,0)}
function upd(){$('cnt').textContent=objs.length+' dona';$('total').textContent=$('hTotal').textContent=sum(total())}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
function openOrder(){if(!objs.length){toast("Avval xonaga mebel joylashtiring");return}
 const g={};objs.forEach(o=>{(g[o.it.id]=g[o.it.id]||{it:o.it,q:0}).q++});
 $('olist').innerHTML=Object.values(g).map(x=>`<div class="li"><img src="${x.it.url}" alt=""><div><b>${x.it.n}</b><br><span style="color:var(--mu)">${x.q} × ${sum(x.it.p)}</span></div><b style="color:var(--ok)">${sum(x.q*x.it.p)}</b></div>`).join('');
 $('mTotal').textContent=sum(total());$('modal').classList.add('show')}
function closeOrder(){$('modal').classList.remove('show')}
function submitOrder(){if(!$('nm').value.trim()||!$('ph').value.trim()){toast("Ism va telefonni kiriting");return}closeOrder();toast("Rahmat! Buyurtma qabul qilindi, operator tez orada bog'lanadi.")}
function exportPNG(){exporting=true;draw();const a=document.createElement('a');a.download='xona-dizayni.png';a.href=cv.toDataURL('image/png');a.click();exporting=false;draw()}
buildRooms();renderCat();upd();draw();
ITEMS.forEach(i=>i.img.onload=()=>{renderCat();draw()});
</script>
</body>
